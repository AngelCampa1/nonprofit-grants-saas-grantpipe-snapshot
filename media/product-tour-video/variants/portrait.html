<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GrantPipe Product Tour Shorts</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&family=Spectral:wght@500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fbfaf6;
        --paper-2: #f4f1e9;
        --card: #ffffff;
        --ink: #0e1a16;
        --muted: #5b6e66;
        --border: #dfe7e3;
        --emerald: #047857;
        --emerald-soft: #e9f6f1;
        --gold: #d99a18;
        --shadow: 0 30px 90px rgba(14, 26, 22, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Manrope", system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.68),
            rgba(244, 241, 233, 0.84)
          ),
          var(--paper);
      }

      .grain {
        position: absolute;
        inset: -80px;
        opacity: 0.42;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(4, 120, 87, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(4, 120, 87, 0.028) 1px, transparent 1px);
        background-size: 66px 66px;
      }

      .ambient {
        position: absolute;
        inset: -20%;
        opacity: 0.3;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 16% 18%,
            rgba(4, 120, 87, 0.2),
            transparent 26%
          ),
          radial-gradient(
            circle at 82% 82%,
            rgba(217, 154, 24, 0.12),
            transparent 28%
          ),
          linear-gradient(
            118deg,
            transparent 18%,
            rgba(4, 120, 87, 0.08) 48%,
            transparent 72%
          );
      }

      .motion-wash {
        position: absolute;
        inset: -18%;
        z-index: 2;
        opacity: 0.18;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 52% 46%,
            rgba(255, 255, 255, 0.78) 0%,
            rgba(4, 120, 87, 0.18) 28%,
            rgba(217, 154, 24, 0.12) 44%,
            transparent 68%
          ),
          radial-gradient(
            circle at 34% 72%,
            rgba(4, 120, 87, 0.14) 0%,
            transparent 54%
          );
        transform: translateX(-560px);
      }

      .app-stage {
        position: absolute;
        left: 48px;
        top: 286px;
        z-index: 4;
        width: 984px;
        height: 852px;
        overflow: hidden;
        border: 1px solid rgba(4, 120, 87, 0.14);
        border-radius: 24px;
        background: var(--card);
        opacity: 0;
        box-shadow: var(--shadow);
      }

      video {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1512px;
        height: 852px;
        background: var(--card);
        object-fit: cover;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        will-change: transform;
      }

      .caption {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 300px;
        z-index: 26;
        min-height: 112px;
        color: var(--ink);
        font-size: 44px;
        font-weight: 800;
        line-height: 1.08;
        text-align: center;
        text-wrap: balance;
        text-shadow:
          0 2px 0 rgba(251, 250, 246, 0.96),
          0 10px 26px rgba(251, 250, 246, 0.82);
      }

      .caption span {
        opacity: 0;
      }

      .scene-card {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        width: 100%;
        height: 100%;
        padding: 148px 78px 164px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 28px;
        background:
          linear-gradient(
            180deg,
            rgba(251, 250, 246, 0.97),
            rgba(244, 241, 233, 0.97)
          ),
          var(--paper);
        opacity: 0;
        visibility: hidden;
      }

      .scene-card.copy-only {
        align-items: center;
        text-align: center;
      }

      .brand-logo {
        width: 386px;
        height: auto;
        margin-bottom: 26px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid #d4ebe1;
        border-radius: 999px;
        background: var(--emerald-soft);
        color: var(--emerald);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 18px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--emerald);
      }

      h1,
      h2 {
        margin: 0;
        color: var(--ink);
        font-family: "Spectral", Georgia, serif;
        font-weight: 600;
        letter-spacing: 0;
      }

      h1 {
        max-width: 900px;
        font-size: 86px;
        line-height: 0.96;
      }

      h2 {
        max-width: 880px;
        font-size: 74px;
        line-height: 0.98;
      }

      .lede {
        max-width: 870px;
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 31px;
        font-weight: 650;
        line-height: 1.28;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin-top: 18px;
        padding: 22px 28px;
        border-radius: 999px;
        background: var(--emerald);
        color: white;
        font-size: 30px;
        font-weight: 800;
        box-shadow: 0 28px 54px rgba(4, 120, 87, 0.24);
      }

      .progress {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 128px;
        z-index: 30;
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(4, 120, 87, 0.12);
      }

      .progress-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, var(--emerald), #0f8a67);
        transform-origin: left center;
        transform: scaleX(0);
      }

      .transition-wash {
        position: absolute;
        inset: 0;
        z-index: 18;
        background: rgba(251, 250, 246, 0.62);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main
      id="root"
      data-composition-id="grantpipe-product-tour-shorts"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="122"
      data-track-index="0"
    >
      <div class="grain"></div>
      <div class="ambient"></div>
      <div id="motion-wash" class="motion-wash"></div>

      <audio
        id="voice"
        data-start="0"
        data-duration="121.4"
        data-track-index="30"
        data-volume="1"
        src="../assets/audio/voice/grantpipe-product-tour-shorts-voice.wav"
      ></audio>
      <audio
        id="sfx-intro"
        data-start="0.2"
        data-duration="0.8"
        data-track-index="31"
        data-volume="0.032"
        src="../assets/audio/sfx/intro-rise.mp3"
      ></audio>
      <audio
        id="sfx-outro"
        data-start="119.4"
        data-duration="1.08"
        data-track-index="32"
        data-volume="0.038"
        src="../assets/audio/sfx/final-resolve.mp3"
      ></audio>

      <div class="app-stage">
        <video
          id="clip-dashboard"
          data-start="1.2"
          data-duration="16.8"
          data-track-index="1"
          data-media-start="8"
          src="../assets/video/01-dashboard.webm"
          muted
          playsinline
        ></video>
        <video
          id="clip-grants"
          data-start="18.2"
          data-duration="20.8"
          data-track-index="1"
          data-media-start="3"
          src="../assets/video/02-grant-portfolio.webm"
          muted
          playsinline
        ></video>
        <video
          id="clip-award"
          data-start="39.2"
          data-duration="20.6"
          data-track-index="1"
          data-media-start="20"
          src="../assets/video/02-grant-portfolio.webm"
          muted
          playsinline
        ></video>
        <video
          id="clip-funds"
          data-start="60.0"
          data-duration="18.0"
          data-track-index="1"
          data-media-start="5"
          src="../assets/video/03-funds-restrictions.webm"
          muted
          playsinline
        ></video>
        <video
          id="clip-reports"
          data-start="78.2"
          data-duration="18.0"
          data-track-index="1"
          data-media-start="4"
          src="../assets/video/05-reports-compliance.webm"
          muted
          playsinline
        ></video>
        <video
          id="clip-evidence"
          data-start="96.4"
          data-duration="14.4"
          data-track-index="1"
          data-media-start="18"
          src="../assets/video/05-reports-compliance.webm"
          muted
          playsinline
        ></video>
        <video
          id="clip-team"
          data-start="111.0"
          data-duration="5.0"
          data-track-index="1"
          data-media-start="12"
          src="../assets/video/07-team-activity.webm"
          muted
          playsinline
        ></video>
      </div>

      <section id="intro-card" class="scene-card">
        <img
          class="brand-logo"
          src="../assets/brand/grantpipe-logo-light.svg"
          alt="GrantPipe"
        />
        <div class="eyebrow">Short product tour</div>
        <h1>Run one grant from deadline to evidence.</h1>
        <p class="lede">
          A fast look at how GrantPipe keeps grants, restricted funds,
          compliance work, and reporting context together.
        </p>
      </section>

      <section id="outro-card" class="scene-card copy-only">
        <img
          class="brand-logo"
          src="../assets/brand/grantpipe-logo-light-outro.svg"
          alt="GrantPipe"
        />
        <div class="eyebrow">Start small</div>
        <h2>One award. One fund. One next report.</h2>
        <div class="cta">Start at GrantPipe.com</div>
        <p class="lede">One-month free trial. No credit card.</p>
      </section>

      <div class="caption" aria-hidden="true"><span id="caption-text"></span></div>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="transition-wash" class="transition-wash"></div>
    </main>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const DURATION = 122;

      tl.to(
        "#motion-wash",
        { x: 1120, duration: DURATION, ease: "none" },
        0,
      );
      tl.to(".ambient", { x: 90, y: -70, duration: DURATION, ease: "none" }, 0);
      tl.to(".app-stage", { opacity: 1, duration: 0.32, ease: "power2.out" }, 1.05);
      tl.to(".app-stage", { opacity: 0, duration: 0.42, ease: "power2.inOut" }, 115.8);

      const cards = [
        {
          selector: "#intro-card",
          start: 0,
          end: 1.2,
          heading: "#intro-card h1",
          hasCta: false,
        },
        {
          selector: "#outro-card",
          start: 116.2,
          end: 122,
          heading: "#outro-card h2",
          hasCta: true,
        },
      ];
      cards.forEach(({ selector, start, end, heading, hasCta }) => {
        tl.set(selector, { visibility: "visible" }, start);
        tl.fromTo(
          selector,
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          start,
        );
        tl.from(
          `${selector} .eyebrow`,
          { opacity: 0, y: 18, duration: 0.45, ease: "power3.out" },
          start + 0.16,
        );
        tl.from(
          heading,
          { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" },
          start + 0.28,
        );
        tl.from(
          `${selector} .lede`,
          { opacity: 0, y: 18, duration: 0.48, ease: "power2.out" },
          start + 0.5,
        );
        if (hasCta) {
          tl.from(
            `${selector} .cta`,
            { opacity: 0, y: 18, duration: 0.48, ease: "power2.out" },
            start + 0.58,
          );
        }
        tl.to(
          selector,
          { opacity: 0, duration: 0.5, ease: "power2.inOut" },
          end - 0.5,
        );
        tl.set(selector, { opacity: 0, visibility: "hidden" }, end);
      });

      const captions = [
        [2.2, 12.8, "Start with the weekly grant check-in."],
        [13.4, 17.8, "Deadlines, risks, balances, and updates stay visible."],
        [19.4, 30.8, "Open the portfolio to see every active award."],
        [32.0, 38.2, "Status, owner, amount, period, and next step are together."],
        [41.0, 49.8, "The award record connects the later questions."],
        [51.0, 58.8, "Allocations, expenses, documents, metrics, and spend down."],
        [62.0, 70.8, "Restricted funds keep approved use and balance close."],
        [72.0, 77.2, "Rules, timing, and proof stay attached."],
        [80.2, 88.8, "Compliance work appears before the final week."],
        [90.2, 95.2, "Reports tie back to agreements and files."],
        [98.2, 105.8, "Evidence bundles package the backup for review."],
        [112.0, 116.0, "Roles and activity history keep handoffs readable."],
      ];

      captions.forEach(([start, end, text]) => {
        tl.set("#caption-text", { textContent: text }, start);
        tl.fromTo(
          "#caption-text",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" },
          start,
        );
        tl.to(
          "#caption-text",
          { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" },
          end - 0.2,
        );
      });

      tl.to(
        "#outro-card",
        { scale: 1.026, y: -14, duration: 5.8, ease: "none" },
        116.2,
      );
      tl.to(
        "#outro-card .cta",
        { scale: 1.035, duration: 1.2, ease: "power1.inOut", yoyo: true, repeat: 3 },
        116.8,
      );

      const cameraMoves = [
        ["#clip-dashboard", 1.2, 16.8, 1.0, 1.03, -150, 0, -70, 0],
        ["#clip-grants", 18.2, 20.8, 1.0, 1.03, -120, 0, 92, 0],
        ["#clip-award", 39.2, 20.6, 1.0, 1.035, 58, 0, 188, 0],
        ["#clip-funds", 60.0, 18.0, 1.0, 1.03, -90, 0, 124, 0],
        ["#clip-reports", 78.2, 18.0, 1.0, 1.03, -70, 0, 146, 0],
        ["#clip-evidence", 96.4, 14.4, 1.0, 1.04, 62, 0, 218, 0],
        ["#clip-team", 111.0, 5.0, 1.0, 1.022, -90, 0, 30, 0],
      ];

      cameraMoves.forEach(
        ([selector, start, duration, fromScale, toScale, fromX, fromY, toX, toY]) => {
          tl.fromTo(
            selector,
            {
              xPercent: -50,
              yPercent: -50,
              scale: fromScale,
              x: fromX,
              y: fromY,
            },
            {
              xPercent: -50,
              yPercent: -50,
              scale: toScale,
              x: toX,
              y: toY,
              duration,
              ease: "none",
            },
            start,
          );
        },
      );

      [18.2, 39.2, 60.0, 78.2, 96.4, 111.0].forEach((start) => {
        tl.fromTo(
          "#transition-wash",
          { opacity: 0 },
          {
            opacity: 0.36,
            duration: 0.12,
            ease: "power1.out",
            yoyo: true,
            repeat: 1,
          },
          start - 0.08,
        );
      });

      tl.to("#progress-fill", { scaleX: 1, duration: DURATION, ease: "none" }, 0);
      window.__timelines["grantpipe-product-tour-shorts"] = tl;
    </script>
  </body>
</html>
