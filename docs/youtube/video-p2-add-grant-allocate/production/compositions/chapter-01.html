<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="../assets/gsap.min.js"></script>
<style>
@font-face{font-family:'Sora';font-weight:700;src:url('../assets/fonts/Sora-700.woff2') format('woff2');font-display:block}
@font-face{font-family:'Sora';font-weight:600;src:url('../assets/fonts/Sora-600.woff2') format('woff2');font-display:block}
@font-face{font-family:'Plex';font-weight:400;src:url('../assets/fonts/PlexSans-400.woff2') format('woff2');font-display:block}
@font-face{font-family:'Plex';font-weight:500;src:url('../assets/fonts/PlexSans-500.woff2') format('woff2');font-display:block}
@font-face{font-family:'Plex';font-weight:600;src:url('../assets/fonts/PlexSans-600.woff2') format('woff2');font-display:block}
@font-face{font-family:'Mono';font-weight:400;src:url('../assets/fonts/PlexMono-400.woff2') format('woff2');font-display:block}
@font-face{font-family:'Mono';font-weight:500;src:url('../assets/fonts/PlexMono-500.woff2') format('woff2');font-display:block}

:root{
  --paper:#faf7f0; --paper2:#f3eee2; --ink:#17211c; --muted:#6c726a;
  --emerald:#065f46; --emerald-d:#053d2e; --emerald-50:#e7f3ee;
  --ochre:#b9842b; --ochre-50:#f6ecd6; --ochre-line:#e4cf9f;
  --red:#b3261e; --red-50:#fbe9e7;
  --line:#e6e0d2; --line2:#d8d0bd; --white:#fffdf8;
  --shadow:0 24px 60px -28px rgba(20,40,30,.45), 0 4px 14px -6px rgba(20,40,30,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper);
  font-family:'Plex',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#root{position:relative;width:1920px;height:1080px;
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(6,95,70,.10), transparent 60%),
    radial-gradient(900px 600px at 8% 108%, rgba(185,132,43,.10), transparent 60%),
    linear-gradient(180deg,var(--paper),var(--paper2));
}
.wordmark{position:absolute;top:54px;left:72px;display:flex;align-items:center;gap:16px;z-index:5}
.wordmark .mark{width:40px;height:40px;display:block}
.wordmark .name{font-family:'Sora';font-weight:700;font-size:30px;letter-spacing:-.4px;color:var(--ink)}
.kicker{position:absolute;top:60px;right:72px;font-family:'Mono';font-weight:500;font-size:19px;letter-spacing:3px;
  color:var(--emerald);text-transform:uppercase;opacity:.9;z-index:5}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.caption{position:absolute;left:72px;bottom:96px;z-index:6;max-width:1500px}
.caption .chip{display:inline-flex;align-items:center;gap:12px;background:var(--emerald);color:var(--white);
  font-family:'Mono';font-weight:500;font-size:20px;letter-spacing:2px;text-transform:uppercase;
  padding:9px 18px;border-radius:999px;box-shadow:var(--shadow)}
.caption .chip .num{background:var(--ochre);color:#3a2a07;border-radius:999px;padding:1px 11px;font-size:18px}
.caption .line{margin-top:18px;font-family:'Sora';font-weight:600;font-size:46px;line-height:1.12;letter-spacing:-.6px;
  color:var(--ink);max-width:1400px}
.progress{position:absolute;left:72px;right:72px;bottom:58px;height:6px;display:flex;gap:7px;z-index:6}
.progress .seg{flex:1;height:6px;border-radius:4px;background:var(--line2)}
.progress .seg.on{background:var(--ochre)}
.progress .seg.done{background:var(--emerald)}

/* Spreadsheet */
.sheet{width:1480px;background:var(--white);border-radius:20px;box-shadow:var(--shadow);
  border:1px solid var(--line);overflow:hidden}
.sheet .tabs{display:flex;gap:6px;padding:16px 20px;background:linear-gradient(180deg,#fff,#fbf8f1);
  border-bottom:1px solid var(--line)}
.sheet .tab{font-family:'Plex';font-weight:600;font-size:20px;color:var(--muted);padding:9px 18px;border-radius:9px}
.sheet .tab.active{background:var(--emerald-50);color:var(--emerald)}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{border:1px solid var(--line);padding:0 18px;height:62px;text-align:left;font-size:24px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{background:var(--emerald-50);color:var(--emerald-d);font-family:'Plex';font-weight:600;font-size:21px;
  letter-spacing:.2px}
td{font-family:'Plex';font-weight:400;color:var(--ink)}
td.mono,th.mono{font-family:'Mono';font-weight:400}
td.num{font-family:'Mono';text-align:right}
.rowhead{width:64px;background:#f7f3ea;color:var(--muted);font-family:'Mono';font-size:18px;text-align:center;
  padding:0}
.colidx td,.colidx th{height:40px;background:#f7f3ea;color:var(--muted);font-family:'Mono';font-size:16px;
  text-align:center;font-weight:400;padding:0}
.hl-ochre{background:var(--ochre-50)!important;box-shadow:inset 0 0 0 2px var(--ochre)}
.hl-emerald{background:var(--emerald-50)!important;box-shadow:inset 0 0 0 2px var(--emerald)}
.hl-red{background:var(--red-50)!important;box-shadow:inset 0 0 0 2px var(--red);color:var(--red)!important}
.tag{display:inline-block;font-family:'Mono';font-size:18px;padding:2px 12px;border-radius:999px;font-weight:500}
.tag.yes{background:var(--ochre-50);color:#7a5410;border:1px solid var(--ochre-line)}
.tag.no{background:#eef0ec;color:var(--muted);border:1px solid var(--line2)}
.callout{position:absolute;z-index:7;background:var(--ink);color:var(--white);border-radius:14px;
  padding:18px 22px;font-family:'Plex';font-weight:500;font-size:26px;box-shadow:var(--shadow);max-width:520px;line-height:1.25}
.callout .k{font-family:'Mono';color:var(--ochre);font-size:18px;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:6px}
.callout::after{content:"";position:absolute;width:18px;height:18px;background:var(--ink);transform:rotate(45deg)}
.bignum{font-family:'Mono';font-weight:500}

/* Browser-chrome screen frame — FIXED BOX across all chapters.
   The card sits at a constant top/left/width/height so the video never jumps.
   Ken-Burns + zoom/pan happen on the INNER .shotzoom wrapper (a transform),
   never on the <img> (which keeps its natural box). The .shotview clips it. */
.screen{position:relative;border-radius:18px;overflow:hidden;background:var(--white);
  box-shadow:var(--shadow);border:1px solid var(--line2)}
.screen .bar{display:flex;align-items:center;gap:16px;height:54px;padding:0 22px;
  background:linear-gradient(180deg,#fbf8f1,#f3eee2);border-bottom:1px solid var(--line)}
.screen .dots{display:flex;gap:10px}
.screen .dots i{width:14px;height:14px;border-radius:999px;background:var(--line2);display:block}
.screen .addr{flex:1;display:flex;align-items:center;gap:10px;height:32px;padding:0 18px;
  background:var(--white);border:1px solid var(--line);border-radius:999px;
  font-family:'Mono';font-weight:400;font-size:18px;color:var(--muted);max-width:560px;margin:0 auto}
.screen .addr .lock{color:var(--emerald);font-size:15px}
/* clipping viewport for the screenshot */
.screen .shotview{position:relative;width:100%;height:616px;overflow:hidden;background:var(--white)}
/* transformable inner wrapper — animate THIS (transform only) for zoom/pan/Ken-Burns */
.screen .shotzoom{position:absolute;top:0;left:0;width:1190px;height:auto;
  transform-origin:0 0;will-change:transform}
.screen .shot{display:block;width:1190px;height:auto}
/* Region spotlight + animated focus ring. Lives INSIDE .shotzoom so it pans/zooms
   with the screenshot automatically (coords are css px relative to the image). */
.spot{position:absolute;z-index:6;border:3px solid var(--ochre);border-radius:14px;
  box-shadow:0 0 0 4px rgba(185,132,43,.18), var(--shadow);pointer-events:none}
</style>
</head>
<body>
<div id="root" data-composition-id="chapter-01" data-start="0" data-duration="38" data-width="1920" data-height="1080">
  <div id="chrome-wordmark" class="wordmark clip" data-start="0" data-duration="38" data-track-index="10"><img class="mark" src="../assets/grantpipe-mark.svg" alt="GrantPipe"/><div class="name">GrantPipe</div></div>
  <div id="chrome-kicker" class="kicker clip" data-start="0" data-duration="38" data-track-index="11">Grants & Allocations</div>
  
      <div class="stage" style="gap:0">
        <div id="list-wrap" style="position:absolute;left:365px;top:120px;width:1190px;opacity:1;"><div class="screen" style="position:relative;width:1190px">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="addr"><span class="lock">&#x1F512;</span>app.grantpipe.com/grants</div>
    </div>
    <div class="shotview">
      <div id="scr-list" class="shotzoom" style=" transform:translate(-314px,0px) scale(1.34);">
        <img class="shot" src="../assets/screens/01-grants-list.png" alt="Grants list with Add grant button"/>
        <div id="sp-add" class="spot" style="left:1008px;top:79px;width:76px;height:35px;opacity:0"></div>
      </div>
    </div>
  </div></div>
        <div id="s1-wrap" style="position:absolute;left:365px;top:120px;width:1190px;opacity:0;"><div class="screen" style="position:relative;width:1190px">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="addr"><span class="lock">&#x1F512;</span>app.grantpipe.com/grants</div>
    </div>
    <div class="shotview">
      <div id="scr-s1" class="shotzoom" style=" transform:translate(-535px,-328px) scale(1.9);">
        <img class="shot" src="../assets/screens/02-create-step1.png" alt="Create grant form: name, funder, amount, status"/>
        
      <div id="sp-name" class="spot" style="left:446px;top:261px;width:299px;height:35px;opacity:0"></div>
      <div id="sp-funder" class="spot" style="left:446px;top:304px;width:165px;height:35px;opacity:0"></div>
      <div id="sp-amount" class="spot" style="left:446px;top:348px;width:299px;height:35px;opacity:0"></div>
      <div id="sp-status" class="spot" style="left:446px;top:400px;width:83px;height:35px;opacity:0"></div>
      <div id="sp-meaning" class="spot" style="left:446px;top:425px;width:299px;height:25px;opacity:0"></div>
      </div>
    </div>
  </div></div>
        <div id="s2-wrap" style="position:absolute;left:365px;top:120px;width:1190px;opacity:0;"><div class="screen" style="position:relative;width:1190px">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="addr"><span class="lock">&#x1F512;</span>app.grantpipe.com/grants</div>
    </div>
    <div class="shotview">
      <div id="scr-s2" class="shotzoom" style=" transform:translate(-387px,-244px) scale(1.65);">
        <img class="shot" src="../assets/screens/03-create-step2.png" alt="Create grant form step two: start and end dates"/>
        
      <div id="sp-start" class="spot" style="left:446px;top:234px;width:299px;height:35px;opacity:0"></div>
      <div id="sp-end" class="spot" style="left:446px;top:277px;width:299px;height:35px;opacity:0"></div>
      </div>
    </div>
  </div></div>
      </div>
      <div id="cap" class="caption clip" data-start="0" data-duration="38" data-track-index="8" style="opacity:0">
    <div class="chip"><span class="num">01</span>Add the grant</div>
    <div class="line">A short two-step form: name, funder, amount, status, then dates.</div>
  </div>
  <div id="chrome-progress" class="clip" data-start="0" data-duration="38" data-track-index="7"><div class="progress"><div class="seg done"></div><div class="seg on"></div><div class="seg "></div><div class="seg "></div><div class="seg "></div><div class="seg "></div></div></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function(){
  const tl = gsap.timeline({ paused: true });
  const D = 38;
  
      // list-wrap is the chapter opener (visible at t=0; no entrance — see frameSlot open).
      tl.fromTo("#cap",{opacity:0,y:28},{opacity:1,y:0,duration:0.7,ease:"power2.out"},0.25);
      // Gentle Ken-Burns push that drifts down into the Portfolio table so the opening
      // establishing frame never holds static (the list has no drift of its own before
      // the dialog crossfade at 5.1). Ends before the crossfade; not near render-end.
      tl.set("#scr-list",{transformOrigin:"0 0"},0);
      tl.fromTo("#scr-list",{transform:"translate(-314px,0px) scale(1.34)"},{transform:"translate(-327px,-29px) scale(1.36)",duration:5.0,ease:"sine.inOut"},0);
      // ring the Add grant button as it's named (~2.6s), then hand off to the dialog.
      tl.fromTo("#sp-add",{opacity:0,scale:0.9},{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},2.6);
      tl.to("#sp-add",{opacity:0,duration:0.4,ease:"power2.in",overwrite:"auto"},4.4);
      // "It's a short form, two steps." (4.77) — crossfade list -> step-1 dialog.
      tl.fromTo("#s1-wrap",{opacity:0,y:18},{opacity:1,y:0,duration:0.7,ease:"power3.out"},4.5);
      tl.to("#list-wrap",{opacity:0,duration:0.6,ease:"power2.in",overwrite:"auto"},5.1);
      // EXCLUSIVE sequential field spotlights on the leading word of each field's narration.
      tl.fromTo("#sp-name",{opacity:0,scale:0.92},{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},6.7);
      tl.to("#sp-name",{opacity:0,duration:0.4,ease:"power2.in",overwrite:"auto"},10.7);
      tl.fromTo("#sp-funder",{opacity:0,scale:0.92},{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},11.2);
      tl.to("#sp-funder",{opacity:0,duration:0.4,ease:"power2.in",overwrite:"auto"},18.9);
      tl.fromTo("#sp-amount",{opacity:0,scale:0.92},{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},19.4);
      tl.to("#sp-amount",{opacity:0,duration:0.4,ease:"power2.in",overwrite:"auto"},21.8);
      tl.fromTo("#sp-status",{opacity:0,scale:0.92},{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},22.6);
      // the stage-meaning line ("set up the award details before you spend") is spoken
      // ~28-32; ring it with the status, hold both through that line.
      tl.fromTo("#sp-meaning",{opacity:0},{opacity:1,duration:0.5,ease:"power2.out"},28.0);
      tl.to(["#sp-status","#sp-meaning"],{opacity:0,duration:0.4,ease:"power2.in",overwrite:"auto"},32.2);
      // continuous slow Ken-Burns on the step-1 dialog so it isn't static across its long hold.
      tl.set("#scr-s1",{transformOrigin:"0 0"},0);
      tl.fromTo("#scr-s1",{transform:"translate(-535px,-328px) scale(1.9)"},{transform:"translate(-571px,-348px) scale(1.96)",duration:27.0,ease:"sine.inOut"},5.0);
      // "Step two is the dates" (32.51) — FAST morph to step-2 (no slow double-exposure).
      // s2 sits on top of s1 in the DOM, so a 0.18s ramp reads as the form advancing.
      tl.fromTo("#s2-wrap",{opacity:0},{opacity:1,duration:0.18,ease:"power1.out"},32.5);
      tl.to("#s1-wrap",{opacity:0,duration:0.14,ease:"power1.in",overwrite:"auto"},32.54);
      // "...when the grant starts and ends." — ring the date fields as they're named.
      tl.fromTo("#sp-start",{opacity:0,scale:0.92},{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},33.8);
      tl.fromTo("#sp-end",{opacity:0,scale:0.92},{opacity:1,scale:1,duration:0.5,ease:"back.out(1.6)"},35.0);
  window.__timelines["chapter-01"] = tl;
})();
</script>
</body>
</html>
