<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GrantPipe — SEO Page Templates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script type="text/babel" src="design-canvas.jsx"></script>
    <style>
      /* ---- brand tokens ---- */
      :root {
        --e9: #033a2c;
        --e8: #054b39;
        --e7: #065f46;
        --e6: #0a7553;
        --e5: #10906a;
        --e1: #d4ebe1;
        --e0: #ecf6f1;
        --g7: #8d6a1f;
        --g6: #b88928;
        --g5: #d6a13a;
        --g1: #f5e8c6;
        --g0: #faf3df;
        --k9: #0e1a16;
        --k7: #2a3a33;
        --k5: #5b6e66;
        --k3: #97a59f;
        --k2: #c9d2cd;
        --k1: #e3e9e6;
        --paper: #fbfaf6;
        --paper2: #f4f1e9;
        --card: #fff;
        --danger: #b8442d;
        --warn: #c98a2b;
        --r: 10px;
        --rlg: 14px;
        --sh: 0 1px 2px rgba(14, 26, 22, 0.05), 0 8px 24px -10px rgba(14, 26, 22, 0.12);
        --shlg: 0 2px 4px rgba(14, 26, 22, 0.06), 0 24px 60px -20px rgba(14, 26, 22, 0.2);
        --display: "Spectral", Georgia, serif;
        --body: "Manrope", system-ui, sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: var(--body);
        background: #e8e4db;
      }

      /* ---- shared article shell ---- */
      .art {
        width: 860px;
        background: var(--paper);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.6;
        color: var(--k9);
        -webkit-font-smoothing: antialiased;
        border-radius: var(--rlg);
        overflow: hidden;
        box-shadow: var(--shlg);
      }
      /* topbar */
      .topbar {
        height: 52px;
        background: var(--paper);
        border-bottom: 1px solid var(--k1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(8px);
        background: color-mix(in oklab, var(--paper) 92%, transparent);
      }
      .topbar-brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--display);
        font-weight: 600;
        font-size: 18px;
      }
      .topbar-mark {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background: var(--e7);
        color: var(--g5);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      .topbar nav {
        display: flex;
        gap: 20px;
        font-size: 13px;
        font-weight: 500;
        color: var(--k7);
      }
      .topbar-cta {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        font-family: var(--body);
        font-weight: 600;
        font-size: 13px;
        border: 1px solid transparent;
        cursor: default;
        white-space: nowrap;
      }
      .btn-p {
        background: var(--e7);
        color: #fff;
      }
      .btn-g {
        background: transparent;
        color: var(--k9);
        border-color: var(--k2);
      }

      /* breadcrumb */
      .crumb {
        padding: 10px 24px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--k5);
        border-bottom: 1px solid var(--k1);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .crumb span {
        color: var(--k3);
      }

      /* two-col layout */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 0;
      }
      .main {
        padding: 32px 28px 56px;
        min-width: 0;
      }
      .sidebar {
        padding: 24px 20px;
        border-left: 1px solid var(--k1);
        background: var(--paper2);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      /* eyebrow */
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        color: var(--e7);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--e0);
        border: 1px solid var(--e1);
        margin-bottom: 10px;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--e6);
      }

      /* headings */
      h1.ph {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(26px, 3.2vw, 36px);
        line-height: 1.08;
        letter-spacing: -0.02em;
        margin: 0 0 14px;
        color: var(--k9);
      }
      h1.ph em {
        font-style: italic;
        color: var(--e7);
      }
      h2.sh {
        font-family: var(--display);
        font-weight: 600;
        font-size: 22px;
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin: 28px 0 10px;
        color: var(--k9);
      }
      h3.th {
        font-family: var(--body);
        font-weight: 700;
        font-size: 16px;
        margin: 20px 0 8px;
      }
      p.bluf {
        font-size: 16px;
        color: var(--k7);
        line-height: 1.6;
        padding: 14px 16px;
        background: var(--e0);
        border-left: 3px solid var(--e7);
        border-radius: 0 var(--r) var(--r) 0;
        margin: 0 0 22px;
      }
      p.body {
        font-size: 14.5px;
        color: var(--k7);
        margin: 0 0 14px;
        line-height: 1.65;
      }
      p.body:last-child {
        margin-bottom: 0;
      }

      /* inline CTA */
      .inline-cta {
        background: var(--e9);
        color: #fff;
        border-radius: var(--rlg);
        padding: 20px 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 24px 0;
      }
      .inline-cta p {
        margin: 0;
        font-size: 14px;
        color: #c0d6cc;
        line-height: 1.4;
      }
      .inline-cta strong {
        display: block;
        font-family: var(--display);
        font-size: 18px;
        margin-bottom: 4px;
      }
      .inline-cta .btn-p {
        background: var(--g6);
        color: var(--e9);
      }

      /* stat pills */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 20px 0;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 12px 14px;
      }
      .stat .v {
        font-family: var(--display);
        font-weight: 600;
        font-size: 26px;
        color: var(--e7);
        line-height: 1;
      }
      .stat .l {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--k5);
        margin-top: 4px;
      }

      /* comparison table */
      .ctable {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        overflow: hidden;
        margin: 18px 0;
        font-size: 13px;
      }
      .ctable table {
        border-collapse: collapse;
        width: 100%;
      }
      .ctable thead th {
        background: var(--paper2);
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--k5);
        padding: 10px 12px;
        border-bottom: 1px solid var(--k1);
        text-align: left;
        font-weight: 500;
      }
      .ctable thead th.us {
        color: var(--e7);
        background: color-mix(in oklab, var(--e0) 60%, var(--card));
      }
      .ctable tbody td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--k1);
        color: var(--k7);
        vertical-align: top;
      }
      .ctable tbody tr:last-child td {
        border-bottom: none;
      }
      .ctable tbody td.us {
        background: color-mix(in oklab, var(--e0) 40%, var(--card));
      }
      .ctable .yes {
        color: var(--e7);
        font-weight: 600;
      }
      .ctable .no {
        color: var(--k3);
      }
      .ctable tbody tr.cat td {
        background: var(--paper2);
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--k5);
        font-weight: 500;
        padding: 7px 12px;
      }

      /* pros/cons */
      .proscons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 18px 0;
      }
      .pc {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 14px 16px;
      }
      .pc h4 {
        font-size: 13px;
        font-weight: 700;
        margin: 0 0 10px;
        color: var(--k9);
      }
      .pc ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 7px;
      }
      .pc li {
        display: flex;
        gap: 8px;
        font-size: 13px;
        color: var(--k7);
        align-items: flex-start;
        line-height: 1.4;
      }
      .pc li svg {
        flex-shrink: 0;
        margin-top: 2px;
      }
      .pc.good .pc-mark {
        color: var(--e6);
      }
      .pc.bad .pc-mark {
        color: var(--danger);
      }

      /* FAQ */
      .faq-list {
        display: grid;
        gap: 3px;
        margin: 16px 0;
      }
      .faq-item {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 0 14px;
      }
      .faq-q {
        font-weight: 600;
        font-size: 14px;
        padding: 12px 0;
        color: var(--k9);
      }
      .faq-a {
        font-size: 13.5px;
        color: var(--k7);
        padding-bottom: 12px;
        line-height: 1.55;
      }

      /* data table (compliance / program) */
      .dtable {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        overflow: hidden;
        margin: 16px 0;
      }
      .dtable table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12.5px;
      }
      .dtable thead th {
        background: var(--paper2);
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--k5);
        padding: 9px 12px;
        border-bottom: 1px solid var(--k1);
        font-weight: 500;
        text-align: left;
      }
      .dtable tbody td {
        padding: 8px 12px;
        border-bottom: 1px solid var(--k1);
        color: var(--k7);
      }
      .dtable tbody tr:last-child td {
        border-bottom: none;
      }

      /* sidebar widgets */
      .sw {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 14px;
      }
      .sw h4 {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--k5);
        margin: 0 0 10px;
      }
      .sw ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 6px;
      }
      .sw li {
        font-size: 13px;
        color: var(--k7);
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .sw li svg {
        flex-shrink: 0;
        color: var(--e6);
        margin-top: 2px;
      }
      .sw-cta {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 16px;
        text-align: center;
      }
      .sw-cta h4 {
        color: var(--k9);
        font-family: var(--display);
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      .sw-cta p {
        color: var(--k5);
        font-size: 12.5px;
        margin: 0 0 12px;
        line-height: 1.4;
      }
      .sw-cta .btn-p {
        background: var(--e7);
        color: #fff;
        width: 100%;
        justify-content: center;
      }
      .sw-cta .fine {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--k3);
        margin-top: 6px;
      }
      .sw-meta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--k5);
        line-height: 1.8;
      }
      .sw-meta .lbl {
        color: var(--k3);
      }

      /* listicle tool card */
      .tool-card {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 18px 20px;
        margin: 0 0 12px;
      }
      .tool-card.top {
        border-color: var(--e7);
        box-shadow: 0 0 0 3px var(--e0);
      }
      .tool-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 8px;
      }
      .tool-name {
        font-family: var(--display);
        font-weight: 600;
        font-size: 18px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .tool-price {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--k5);
        text-align: right;
      }
      .tool-badge {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        background: var(--e7);
        color: #fff;
        padding: 2px 8px;
        border-radius: 999px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: inline-block;
        margin-bottom: 6px;
      }
      .tool-sum {
        font-size: 13.5px;
        color: var(--k7);
        margin: 0 0 10px;
        line-height: 1.5;
      }
      .tool-verdict {
        background: var(--paper2);
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 13px;
        font-style: italic;
        color: var(--k7);
      }

      /* feature mock */
      .feat-mock {
        background: var(--e9);
        border-radius: var(--r);
        padding: 16px 18px;
        margin: 16px 0;
        overflow: hidden;
      }
      .feat-mock .mock-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 10px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 6px;
        margin-bottom: 6px;
        font-size: 12.5px;
        color: #d4ebe1;
      }
      .feat-mock .mock-row:last-child {
        margin-bottom: 0;
      }
      .feat-mock .mock-bar {
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        flex: 1;
        margin: 0 10px;
        overflow: hidden;
      }
      .feat-mock .mock-fill {
        height: 100%;
        border-radius: 3px;
        background: var(--e5);
      }
      .feat-mock .mock-fill.warn {
        background: var(--g5);
      }
      .feat-mock .mock-fill.over {
        background: var(--danger);
      }
      .feat-mock .mock-pct {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--g5);
      }

      /* persona pain points */
      .pain-list {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 14px 16px;
        margin: 16px 0;
      }
      .pain-list ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .pain-list li {
        display: flex;
        gap: 10px;
        font-size: 13.5px;
        color: var(--k7);
        align-items: flex-start;
        line-height: 1.45;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--k1);
      }
      .pain-list li:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .pain-num {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--g6);
        min-width: 20px;
        margin-top: 1px;
      }

      /* guide TOC */
      .toc {
        background: var(--paper2);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 14px 16px;
        margin: 14px 0 24px;
      }
      .toc h4 {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--k5);
        margin: 0 0 10px;
      }
      .toc ol {
        padding-left: 18px;
        margin: 0;
        display: grid;
        gap: 5px;
      }
      .toc li {
        font-size: 13px;
        color: var(--e7);
        line-height: 1.35;
      }

      /* pill / badge */
      .pill {
        display: inline-block;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 999px;
        border: 1px solid var(--k2);
        color: var(--k7);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .pill.em {
        background: var(--e0);
        border-color: var(--e1);
        color: var(--e7);
      }
      .pill.gd {
        background: var(--g0);
        border-color: var(--g1);
        color: var(--g7);
      }
      .pill.dk {
        background: var(--e9);
        border-color: var(--e9);
        color: #fff;
      }

      /* local funders list (city page) */
      .funder-list {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        overflow: hidden;
        margin: 16px 0;
      }
      .funder-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--k1);
        align-items: center;
        font-size: 13px;
      }
      .funder-row:last-child {
        border-bottom: none;
      }
      .funder-row .fn {
        font-weight: 600;
        color: var(--k9);
      }
      .funder-row .ft {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--k5);
      }
      .funder-row .fa {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--e7);
        font-weight: 600;
      }

      /* state compliance table */
      .comp-row {
        display: grid;
        grid-template-columns: 1.2fr 1fr 0.8fr;
        padding: 8px 12px;
        border-bottom: 1px solid var(--k1);
        font-size: 12.5px;
        align-items: center;
        background: var(--card);
      }
      .comp-row.head {
        background: var(--paper2);
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--k5);
        font-weight: 500;
      }
      .comp-row:last-child {
        border-bottom: none;
      }
      .comp-wrap {
        border: 1px solid var(--k1);
        border-radius: var(--r);
        overflow: hidden;
        margin: 14px 0;
      }

      /* vertical program list */
      .prog-list {
        background: var(--card);
        border: 1px solid var(--k1);
        border-radius: var(--r);
        padding: 14px 16px;
        margin: 16px 0;
      }
      .prog-list ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .prog-list li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 13.5px;
        color: var(--k7);
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--k1);
      }
      .prog-list li:last-child {

              <h2 className="sh">What "restricted" means under FASB ASC 958</h2>
              <p className="body">

                federal grant restricted to a housing program, a donor gift restricted to
                scholarships, a board-designated reserve — each carries a promise about how the
                money will be used. FASB ASC 958-205 formalizes this by requiring nonprofits to
                classify net assets into two buckets: <em>with donor restrictions</em> and{" "}
                <em>without donor restrictions</em>.
              </p>
              <p className="body">
                The requirement is simple to state and surprisingly hard to execute when grants,
                individual gifts, and board designations are tracked in separate systems.
